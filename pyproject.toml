[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-crossover"
version = "0.1.1"
description = "Multi-source HVAC efficiency optimizer and thermodynamic crossover coordinator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Doug Larrick", email = "doug@parkercat.org" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dlarrick/hvac-crossover"
Repository = "https://github.com/dlarrick/hvac-crossover"
Issues = "https://github.com/dlarrick/hvac-crossover/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hvac_crossover*"]

[tool.setuptools.package-data]
hvac_crossover = ["profiles/producers/**/*.json"]
